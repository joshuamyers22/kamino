[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "kamino"
version = "0.0.1"
description = "Versioned Gaussian linear mixed-model compatibility for Python"
readme = "README.md"
license = "MIT"
authors = [{ name = "Joshua Myers" }]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
  "numpy>=1.26,<3",
]

[project.urls]
Homepage = "https://github.com/joshuamyers22/kamino"
Issues = "https://github.com/joshuamyers22/kamino/issues"
Repository = "https://github.com/joshuamyers22/kamino"

[project.optional-dependencies]
formula-spike = [
  "formulae>=0.5,<0.6",
  "formulaic>=1.2,<2",
  "pandas>=2.2,<4",
]
backend-spike = [
  "scipy>=1.12,<2",
]

[dependency-groups]
dev = [
  "hypothesis>=6.130,<7",
  "pyright==1.1.411",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff==0.16.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kamino"]

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["docs/archive"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
include = ["src", "tests", "tools"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["kamino"]

[tool.coverage.report]
fail_under = 90
show_missing = true
