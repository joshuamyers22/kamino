[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "kamino-lme"
version = "0.0.1"
description = "Versioned Gaussian linear mixed-model compatibility for Python"
readme = "README.md"
license = "MIT"
authors = [{ name = "Joshua Myers" }]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
  "formulae==0.5.4",
  "numpy>=1.26,<3",
  "pandas>=2.2,<4",
  "scipy>=1.12,<2",
  "threadpoolctl>=3.5,<4",
]

[project.urls]
Homepage = "https://github.com/joshuamyers22/kamino"
Issues = "https://github.com/joshuamyers22/kamino/issues"
Repository = "https://github.com/joshuamyers22/kamino"
Changelog = "https://github.com/joshuamyers22/kamino/blob/main/CHANGELOG.md"
Documentation = "https://github.com/joshuamyers22/kamino#readme"
Security = "https://github.com/joshuamyers22/kamino/security/policy"

[project.optional-dependencies]
postfit-statsmodels = [
  "statsmodels==0.14.6",
]

[dependency-groups]
dev = [
  "formulaic>=1.2,<2",
  "hypothesis>=6.130,<7",
  "pyright==1.1.414",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff==0.16.7",
  "statsmodels==0.14.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kamino"]

[tool.hatch.build.targets.sdist]
include = [
  "/CHANGELOG.md",
  "/LICENSE",
  "/README.md",
  "/pyproject.toml",
  "/src/**",
]

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["docs/archive"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
include = ["src", "tests", "tools"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["kamino"]

[tool.coverage.report]
fail_under = 90
show_missing = true
