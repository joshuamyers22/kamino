version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns: ["*"]
    # Formulae is part of the statistical compatibility profile. Upgrade it only
    # with regenerated X/Z contract evidence, never as a routine version bump.
    ignore:
      - dependency-name: formulae
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      workflow-actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /oracle
    schedule:
      interval: weekly
    # The R image is an oracle identity, not an ordinary runtime dependency.
    # Changing it requires a new profile and regenerated reference fixtures.
    ignore:
      - dependency-name: rocker/r-ver
